set timeout=3
set default=0
insmod all_video
insmod gfxterm

menuentry "Lumina OS" {
    multiboot /boot/lumina.elf
    module /boot/initrd.tar initrd
    boot
}
menuentry "Lumina OS (verbose boot)" {
    multiboot /boot/lumina.elf verbose
    module /boot/initrd.tar initrd
    boot
}
menuentry "Lumina OS (classic theme, safe mode)" {
    multiboot /boot/lumina.elf safe
    module /boot/initrd.tar initrd
    boot
}
