set timeout=5
set default=0
insmod all_video
insmod gfxterm
insmod part_msdos
insmod part_gpt
insmod fat
insmod ntfs
insmod multiboot
insmod multiboot2
insmod acpi
if [ "$grub_platform" = "efi" ]; then
    insmod efi_gop
fi
# Ask for the best mode the display reports, then common 32-bit fallbacks.
# gfxpayload=keep hands that mode's linear framebuffer to the kernel, so a
# real GPU shows its native resolution instead of a fixed 1024x768 panel.
set gfxmode=1920x1080x32,1680x1050x32,1600x900x32,1440x900x32,1366x768x32,1280x1024x32,1280x800x32,1024x768x32,auto
set gfxpayload=keep

# If THE WRLD OS is already installed on the first hard disk, boot it by default.
# Setup installs a BIOS/MBR boot loader, so this only makes sense on the PC
# platform; EFI firmware must find an EFI System Partition instead.
if [ "$grub_platform" = "pc" ]; then
    if [ -f (hd0,msdos1)/boot/wrld.elf -o -f (hd0,msdos2)/boot/wrld.elf -o -f (hd0,msdos3)/boot/wrld.elf -o -f (hd0,msdos4)/boot/wrld.elf ]; then
        menuentry "Boot THE WRLD OS from the hard disk" {
            set root=(hd0)
            chainloader +1
            boot
        }
    fi
fi

menuentry "THE WRLD OS Live (runs from the CD; nothing is saved)" {
    multiboot2 /boot/wrld.elf
    module2 /boot/initrd.tar initrd
    boot
}
menuentry "Install THE WRLD OS" {
    multiboot2 /boot/wrld.elf setup
    module2 /boot/initrd.tar initrd
    boot
}
menuentry "Install THE WRLD OS (text mode)" {
    multiboot2 /boot/wrld.elf setup setup=text
    module2 /boot/initrd.tar initrd
    boot
}
menuentry "THE WRLD OS Live (verbose boot)" {
    multiboot2 /boot/wrld.elf verbose
    module2 /boot/initrd.tar initrd
    boot
}
menuentry "THE WRLD OS Live (safe mode - Classic theme)" {
    multiboot2 /boot/wrld.elf safe
    module2 /boot/initrd.tar initrd
    boot
}
