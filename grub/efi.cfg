# Embedded in BOOTX64.EFI by grub-mkimage.
#
# Setup puts this loader and the real menu on the system partition, which is
# an EFI System Partition (FAT32) after a UEFI install.  Search for the menu so
# the loader keeps working if the ESP and the system partition are different.
search --no-floppy --file /boot/grub/grub.cfg --set=root
if [ -z "$root" ]; then
    set root=(hd0,msdos1)
fi
set prefix=($root)/boot/grub
normal
