# THE WRLD OS: the CD with both editions (make dual / make both).
# On a processor that can run 64-bit code (cpuid -l) the 64-bit edition starts by default:
# it has The WRLD Browser on WebKit and runs 64-bit Windows programs. The 32-bit edition
# (the browser's classic engine, 32-bit Windows programs) is in the menu, and it is the
# only choice on a 32-bit processor.
set timeout=5
set default=0
insmod all_video
insmod gfxterm
insmod part_msdos
insmod part_gpt
insmod fat
insmod ntfs
insmod multiboot
insmod multiboot2
insmod acpi
insmod cpuid
if [ "$grub_platform" = "efi" ]; then
    insmod efi_gop
fi
# the best mode the display reports, then common fallbacks (see grub.cfg)
set gfxmode=1920x1080x32,1680x1050x32,1600x900x32,1440x900x32,1366x768x32,1280x1024x32,1280x800x32,1024x768x32,1024x768x24,1024x768x16,800x600x32,800x600x24,800x600x16,auto
set gfxpayload=keep

# THE WRLD OS already installed on the first hard disk: boot it by default (BIOS only)
if [ "$grub_platform" = "pc" ]; then
    if [ -f (hd0,msdos1)/boot/wrld.elf -o -f (hd0,msdos2)/boot/wrld.elf -o -f (hd0,msdos3)/boot/wrld.elf -o -f (hd0,msdos4)/boot/wrld.elf ]; then
        menuentry "Boot THE WRLD OS from the hard disk" {
            set root=(hd0)
            chainloader +1
            boot
        }
    fi
fi

if cpuid -l; then
    menuentry "THE WRLD OS Live, 64-bit (WebKit browser; nothing is saved)" {
        multiboot2 /boot/wrld64.elf
        module2 /boot/initrd64.tar initrd
        boot
    }
    menuentry "THE WRLD OS Live, 32-bit (for 32-bit Windows programs)" {
        multiboot2 /boot/wrld.elf
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "Install THE WRLD OS, 64-bit" {
        multiboot2 /boot/wrld64.elf setup
        module2 /boot/initrd64.tar initrd
        boot
    }
    menuentry "Install THE WRLD OS, 32-bit" {
        multiboot2 /boot/wrld.elf setup
        module2 /boot/initrd.tar initrd
        boot
    }
    submenu "More options (text-mode Setup, verbose boot, recovery, safe mode)" {
        menuentry "Install THE WRLD OS, 64-bit (text mode)" {
            multiboot2 /boot/wrld64.elf setup setup=text
            module2 /boot/initrd64.tar initrd
            boot
        }
        menuentry "Install THE WRLD OS, 32-bit (text mode)" {
            multiboot2 /boot/wrld.elf setup setup=text
            module2 /boot/initrd.tar initrd
            boot
        }
        menuentry "64-bit Live (verbose boot)" {
            multiboot2 /boot/wrld64.elf verbose
            module2 /boot/initrd64.tar initrd
            boot
        }
        menuentry "64-bit Live (WRLD Basic Display recovery)" {
            multiboot2 /boot/wrld64.elf video=basic verbose
            module2 /boot/initrd64.tar initrd
            boot
        }
        menuentry "64-bit Live (safe mode - Classic theme)" {
            multiboot2 /boot/wrld64.elf safe
            module2 /boot/initrd64.tar initrd
            boot
        }
        menuentry "32-bit Live (verbose boot)" {
            multiboot2 /boot/wrld.elf verbose
            module2 /boot/initrd.tar initrd
            boot
        }
        menuentry "32-bit Live (WRLD Basic Display recovery)" {
            multiboot2 /boot/wrld.elf video=basic verbose
            module2 /boot/initrd.tar initrd
            boot
        }
        menuentry "32-bit Live (safe mode - Classic theme)" {
            multiboot2 /boot/wrld.elf safe
            module2 /boot/initrd.tar initrd
            boot
        }
    }
else
    # a 32-bit processor: the 32-bit edition only
    menuentry "THE WRLD OS Live (runs from the CD; nothing is saved)" {
        multiboot2 /boot/wrld.elf
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "Install THE WRLD OS" {
        multiboot2 /boot/wrld.elf setup
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "Install THE WRLD OS (text mode)" {
        multiboot2 /boot/wrld.elf setup setup=text
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "THE WRLD OS Live (verbose boot)" {
        multiboot2 /boot/wrld.elf verbose
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "THE WRLD OS Live (WRLD Basic Display recovery)" {
        multiboot2 /boot/wrld.elf video=basic verbose
        module2 /boot/initrd.tar initrd
        boot
    }
    menuentry "THE WRLD OS Live (safe mode - Classic theme)" {
        multiboot2 /boot/wrld.elf safe
        module2 /boot/initrd.tar initrd
        boot
    }
fi
