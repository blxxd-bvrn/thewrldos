<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE WRLD OS Logo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;800&display=swap">
<style>
/* Layout: one full-bleed stage. A WebGL layer paints space, the hologram, the
   shockwave and the Luna-blue ground; a 2D layer above it carries the letters,
   the instrument rings and the lens light. One deliberate look, dark-first. */
:root {
  --space: #02030a;      /* deep space, and the page ground before the first frame */
  --luna: #5a7edc;       /* the log-on screen's blue */
  --luna-deep: #00309c;  /* its top and bottom bands */
  --ink: #f4f8ff;        /* wordmark white */
  --holo: #7fe9ff;       /* hologram cyan */
  --accent: #f08a24;     /* the orange of "OS" */
  --font-display: "Libre Franklin", "Franklin Gothic Medium", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --font-ui: Tahoma, Verdana, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--space); color: var(--ink); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-family: var(--font-ui);
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ov { pointer-events: none; }
#replay {
  position: fixed; z-index: 2;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  font: 600 13px/1 var(--font-ui); letter-spacing: .02em; color: var(--ink);
  background: color-mix(in srgb, var(--luna-deep) 70%, transparent);
  border: 1px solid color-mix(in srgb, var(--ink) 45%, transparent); border-radius: 4px;
  padding: 9px 16px; cursor: pointer; opacity: 0; transition: opacity .6s ease, background .15s ease;
}
#replay.show { opacity: .9; }
#replay:hover { opacity: 1; background: var(--luna); }
#replay:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; opacity: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>

  c = mix(c, vec3(1.0), grid(lat, lon, 6.0) * 0.16);       /* the logo's faint 30 degree graticule */
  vec3 hv = normalize(L + vec3(0.0, 0.0, 1.0));
  c += pow(max(dot(n, hv), 0.0), 60.0) * (1.0 - mk) * 0.5; /* sun glint on the ocean */
  float gloss = exp(-(pow(p.x + 0.38, 2.0) + pow(p.y - 0.42, 2.0)) / 0.07) * 0.42;
  c = mix(c, vec3(1.0), gloss);
  float rim = pow(clamp((r - 0.78) / 0.22, 0.0, 1.0), 2.0) * 0.55;
  c = mix(c, vec3(0.55, 0.78, 1.0), rim);
  return vec4(c, smoothstep(1.0, 1.0 - 2.0 * uPx / uR, r));
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  float dist = length(frag - uC);
  float m = uXp * smoothstep(uWave + 34.0 * uPx, uWave - 34.0 * uPx, dist);   /* inside the shockwave: Luna blue */
  vec3 col = mix(space(frag), luna(frag), m);
  float vg = smoothstep(0.35, 1.15, length((frag - 0.5 * uRes) / uRes.y));
  col *= 1.0 - mix(0.40, 0.16, m) * vg;
  /* letterbox bars that become the log-on screen's bands */
  float yb = min(frag.y, uRes.y - frag.y);
  if (yb < uBar) {
    vec3 b = mix(vec3(0.0, 0.188, 0.612), vec3(0.0, 0.235, 0.706), yb / uBar);
    if (yb > uBar - 2.0 * uPx) {
      float cx = 1.0 - abs(frag.x / uRes.x - 0.5) * 2.0;
      b = frag.y > 0.5 * uRes.y ? mix(vec3(0.353, 0.494, 0.863), vec3(0.722, 0.816, 1.0), cx)
                                : mix(vec3(0.910, 0.541, 0.188), vec3(1.0, 0.816, 0.541), cx);
    }
    col = b * m;
  }
  col += exp(-pow((dist - uWave) / (26.0 * uPx), 2.0)) * uWaveI * vec3(0.75, 0.92, 1.0);

  vec2 p = (frag - uC) / uR, pg = p;
  if (uGlitch > 0.0) {
    float bandId = floor(frag.y / (6.0 * uPx));
    float on = step(0.72, hash21(vec2(bandId * 1.7, floor(uTime * 11.0))));
    pg.x += (hash21(vec2(bandId, floor(uTime * 24.0))) - 0.5) * 0.14 * uGlitch * on;
  }
  float r = length(p);
  /* the real globe sweeps down over the hologram from the lit pole */
  float ls = smoothstep(0.0, 0.3, uSolid * 1.3 - (0.5 - 0.5 * p.y));
  vec4 e = earth(p);
  float hk = uHolo * (1.0 - smoothstep(0.75, 1.0, uSolid));
  if (hk > 0.0) col += holo(pg, frag) * hk * (r < 1.0 ? 1.0 - ls * 0.92 : 1.0 - uSolid);
  if (uSolid > 0.0) {
    if (r < 1.0) { col = mix(col, e.rgb, e.a * ls); col += vec3(0.8, 1.0, 1.0) * ls * (1.0 - ls) * 3.2; }
    else col += e.rgb * e.a * uSolid;
  }
  col += uFlash * (vec3(0.85, 0.95, 1.0) * exp(-pow(dist / (uR * 2.0), 2.0)) * 0.95 + 0.05);
  col += (hash21(frag + fract(uTime) * 91.7) - 0.5) * 0.028;
  gl_FragColor = vec4(col * uFade, 1.0);
}`;

let gl = null, U = {}, texReady = 0;
function initGL() {
  try { gl = glc.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" }); } catch (e) { gl = null; }
  if (!gl || !gl.getExtension("OES_standard_derivatives")) { gl = null; return; }
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; } return s; };
  const vs = sh(gl.VERTEX_SHADER, VS), fs = sh(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) { gl = null; return; }
  const pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(pr)); gl = null; return; }
  gl.useProgram(pr);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ["uRes", "uC", "uGlow", "uTime", "uR", "uRot", "uHolo", "uSolid", "uReveal", "uWave", "uWaveI", "uXp", "uFlash", "uFade", "uBar", "uGlitch", "uPx", "uTex", "uMask"])
    U[n] = gl.getUniformLocation(pr, n);
  gl.uniform1i(U.uTex, 0); gl.uniform1i(U.uMask, 1);
}
function loadTexture(unit, src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      if (gl) {
        const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

/* ------------------------------------------------------------------ layout */
let W = 0, H = 0, DPR = 1, L = null;
const GLYPHS = "THEWRLDOS".split("");
const LAND_ORDER = [4, 5, 6, 0, 1, 2, 3, 7, 8];       /* WRLD lands first, then THE, then OS */
function layout() {
  W = document.documentElement.clientWidth; H = document.documentElement.clientHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  for (const c of [glc, ovc]) { c.width = Math.max(1, Math.round(W * DPR)); c.height = Math.max(1, Math.round(H * DPR)); }
  if (gl) gl.viewport(0, 0, glc.width, glc.height);
  const bar = clamp(H * 0.11, 34, 110), minD = Math.min(W, H - 2 * bar);
  const m = (weight, size, s) => { ctx.font = `${weight} ${size}px ${FONT}`; return ctx.measureText(s); };
  /* the lock-up, measured at 100px and scaled: globe, gap, WRLD, gap, OS */
  const wW = m(800, 100, "WRLD").width / 100, wO = m(800, 50, "OS").width / 100;
  const units = 1.56 + 0.20 + wW + 0.10 + wO;
  const F = Math.min(W * 0.86 / units, (H - 2 * bar) * 0.34, 210);
  const mm = m(800, F, "W"), cap = (mm.actualBoundingBoxAscent || F * 0.7), capK = cap / F;
  const total = units * F, left = (W - total) / 2, cy = H / 2;
  const Rf = 0.78 * F, gx = left + Rf, x0 = left + 2 * Rf + 0.20 * F;
  const sT = 0.205 * F, capT = capK * sT, gapT = 0.11 * F;
  const baseW = cy + (cap + gapT + capT) / 2 - 0.02 * F, baseT = baseW - cap - gapT;
  const g = [];
  let x = x0 + 0.045 * F;                                /* THE, letter-spaced over the start of WRLD */
  for (const ch of "THE") { const w = m(600, sT, ch).width; g.push({ ch, size: sT, weight: 600, x: x + w / 2, base: baseT, col: [221, 229, 243] }); x += w + 0.135 * F; }
  let prev = 0;
  for (let i = 1; i <= 4; i++) { const w = m(800, F, "WRLD".slice(0, i)).width; g.push({ ch: "WRLD"[i - 1], size: F, weight: 800, x: x0 + (prev + w) / 2, base: baseW, col: [255, 255, 255] }); prev = w; }
  const xo = x0 + wW * F + 0.10 * F, sO = 0.5 * F; prev = 0;
  for (let i = 1; i <= 2; i++) { const w = m(800, sO, "OS".slice(0, i)).width; g.push({ ch: "OS"[i - 1], size: sO, weight: 800, x: xo + (prev + w) / 2, base: baseW, col: [240, 138, 36] }); prev = w; }
  g.forEach((q, i) => { q.cy = q.base - capK * q.size / 2; q.order = LAND_ORDER.indexOf(i); q.amp = (i % 2 ? 1 : -1) * (0.35 + 0.12 * (i % 3)); q.lift = (i % 2 ? -1 : 1) * (0.05 + 0.02 * (i % 4)); });
  L = { bar, minD, F, capK, cy, gx, Rf, x0, textR: xo + wO * F, baseW, glyphs: g, glow: [W * 0.5, H * 0.47] };
}

/* ------------------------------------------------------------------ the score */
function state(t) {
  const s = {};
  const Rh = L.minD * (0.235 + 0.045 * outSine(seg(t, 0, 5.2)));
  const gm = inOut(seg(t, 5.75, 7.55));
  s.cx = mix(W / 2, L.gx, gm); s.cy = mix(H / 2, L.cy, gm); s.R = mix(Rh, L.Rf, gm); s.Rh = Rh;
  /* spin: fast as a hologram, slowing to the logo's pose (20 degrees west), then a slow drift */
  const T = 7.6, w0 = 1.5, w1 = 0.07, tt = Math.min(t, T), rem = 1 - tt / T;
  s.rot = -0.35 - (w1 * (T - tt) + (w0 - w1) * T / 3 * rem * rem * rem) + Math.max(0, t - T) * w1;
  s.fade = Math.pow(seg(t, 0, 1.4), 1.5);
  s.holo = seg(t, 0.8, 1.3);
  s.reveal = inOut(seg(t, 0.9, 2.7));
  s.solid = inOut(seg(t, 4.95, 6.2));
  const w = seg(t, 5.0, 6.7);
  s.xp = t >= 5.0 ? 1 : 0;
  s.wave = t >= 5.0 ? s.R + outCubic(w) * Math.hypot(W, H) * 1.15 : -1e4;
  s.waveI = t >= 5.0 ? Math.pow(1 - w, 1.5) : 0;
  s.flash = t < 5.0 ? 0 : t < 5.12 ? (t - 5.0) / 0.12 : Math.exp(-(t - 5.12) * 2.6);
  const g1 = seg(t, 0.85, 1.05) * (1 - seg(t, 1.25, 1.7)), g2 = Math.pow(seg(t, 4.1, 5.0), 2) * (t < 5.05 ? 1 : 0);
  s.glitch = Math.max(g1, g2);
  s.hud = s.holo * (1 - seg(t, 4.9, 5.5));
  return s;
}

/* ------------------------------------------------------------------ drawing */
function drawGL(t, s) {
  if (!gl) return;
  const px = DPR, hy = H * DPR;
  gl.uniform2f(U.uRes, glc.width, glc.height);
  gl.uniform2f(U.uC, s.cx * px, hy - s.cy * px);
  gl.uniform2f(U.uGlow, L.glow[0] * px, hy - L.glow[1] * px);
  gl.uniform1f(U.uTime, t); gl.uniform1f(U.uR, s.R * px);
  gl.uniform1f(U.uRot, ((s.rot % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI));
  gl.uniform1f(U.uHolo, s.holo); gl.uniform1f(U.uSolid, texReady >= 2 ? s.solid : 0); gl.uniform1f(U.uReveal, s.reveal);
  gl.uniform1f(U.uWave, s.wave * px); gl.uniform1f(U.uWaveI, s.waveI); gl.uniform1f(U.uXp, s.xp);
  gl.uniform1f(U.uFlash, s.flash); gl.uniform1f(U.uFade, s.fade); gl.uniform1f(U.uBar, L.bar * px);
  gl.uniform1f(U.uGlitch, s.glitch); gl.uniform1f(U.uPx, px);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
/* without WebGL: the same story told plainly */
function drawFallback(t, s) {
  const k = seg(t, 5.0, 6.4);
  ctx.fillStyle = "#02030a"; ctx.fillRect(0, 0, W, H);
  if (k > 0) {
    const g = ctx.createRadialGradient(L.glow[0], L.glow[1], 0, L.glow[0], L.glow[1], Math.max(W, H) * 0.8);
    g.addColorStop(0, "#86adf7"); g.addColorStop(1, "#4a6bd1");
    ctx.globalAlpha = k; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#00309c"; ctx.fillRect(0, 0, W, L.bar); ctx.fillRect(0, H - L.bar, W, L.bar);
    ctx.globalAlpha = 1;
  }
  const g2 = ctx.createRadialGradient(s.cx - s.R * 0.4, s.cy - s.R * 0.4, s.R * 0.1, s.cx, s.cy, s.R);
  g2.addColorStop(0, k > 0.5 ? "#9fd0ff" : "#bff6ff"); g2.addColorStop(1, k > 0.5 ? "#0a3a8c" : "#0b5d78");
  ctx.globalAlpha = s.fade * (k > 0.5 ? 1 : 0.6); ctx.fillStyle = g2;
  ctx.beginPath(); ctx.arc(s.cx, s.cy, s.R, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
}

const INCL = 0.34, ROLL = -0.22;
function orbit(theta, ro, cx, cy) {
  const X = Math.cos(theta) * ro, Y = Math.sin(theta) * ro * Math.sin(INCL), depth = Math.sin(theta) * Math.cos(INCL);
  return { x: cx + X * Math.cos(ROLL) - Y * Math.sin(ROLL), y: cy + X * Math.sin(ROLL) + Y * Math.cos(ROLL), depth };
}
function drawHud(t, s, back) {
  const a = s.hud; if (a <= 0) return;
  const k = outBack(seg(t, 0.9, 2.0)), R = s.R, c = (al) => `rgba(127,233,255,${al * a})`;
  ctx.save(); ctx.translate(s.cx, s.cy); ctx.lineCap = "butt";
  const ro = R * 1.62 * k;
  ctx.strokeStyle = c(back ? 0.16 : 0.30); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(0, 0, ro, ro * Math.sin(INCL), ROLL, back ? Math.PI : 0, back ? 2 * Math.PI : Math.PI); ctx.stroke();
  if (!back) {
    ctx.strokeStyle = c(0.55); ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < 90; i++) {                        /* a degree ring: a tick every 4 degrees */
      const th = i / 90 * Math.PI * 2 + t * 0.12, r0 = R * 1.12 * k, r1 = r0 + (i % 9 ? 4 : 10);
      ctx.moveTo(Math.cos(th) * r0, Math.sin(th) * r0); ctx.lineTo(Math.cos(th) * r1, Math.sin(th) * r1);
    }
    ctx.stroke();
    ctx.strokeStyle = c(0.75); ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) { const th = -t * 0.55 + i * 2.094; ctx.beginPath(); ctx.arc(0, 0, R * 1.25 * k, th, th + 1.15); ctx.stroke(); }
    ctx.strokeStyle = c(0.4); ctx.lineWidth = 1; ctx.setLineDash([3, 7]);
    ctx.beginPath(); ctx.arc(0, 0, R * 1.36 * k, t * 0.3, t * 0.3 + 4.4); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = c(0.5); ctx.lineWidth = 1.5;         /* framing brackets */
    const b = Math.min(R * 1.86, W / 2 - 10, H / 2 - L.bar - 10) * k, q = R * 0.16;   /* inside the letterbox */
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      ctx.beginPath(); ctx.moveTo(sx * b, sy * (b - q)); ctx.lineTo(sx * b, sy * b); ctx.lineTo(sx * (b - q), sy * b); ctx.stroke();
    }
  }

}
function glyphState(q, i, t, s) {
  const appear = seg(t, 2.2 + 0.13 * i, 2.75 + 0.13 * i);
  const b = 5.55 + q.order * 0.11, k = seg(t, b, b + 1.55), e = inOut(k);
  const theta = 1.2 - i * (2 * Math.PI / 9) - 0.62 * t;
  const o = orbit(theta, s.Rh * 1.62 * mix(1, 1.25, e), mix(s.cx, W / 2, e), mix(s.cy, H / 2, e));
  const so = s.Rh * 0.235 * (1 + 0.24 * o.depth);
  const bump = Math.sin(Math.PI * k);
  let size = mix(so, q.size, e) * (1 + 0.16 * bump);
  if (q.ch === "O" || q.ch === "S") { const p = seg(t, 8.0, 8.55); size *= 1 + 0.2 * Math.sin(Math.PI * p) * (1 - p); }
  const flick = e < 1 ? 0.86 + 0.14 * Math.sin(t * 31 + i * 5.1) * Math.sin(t * 13.7 + i) : 1;
  return {
    x: mix(o.x, q.x, e), y: mix(o.y, q.cy, e) + bump * q.lift * H, size, e, depth: o.depth,
    rot: bump * q.amp, back: e < 0.02 && o.depth < 0,
    alpha: appear * mix(o.depth < 0 ? 0.5 : 0.95, 1, e) * mix(flick, 1, e),
    col: [mix(127, q.col[0], e), mix(233, q.col[1], e), mix(255, q.col[2], e)],

}
function drawGlyph(q, g) {
  if (g.alpha <= 0.003) return;
  ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.rot);
  ctx.font = `${q.weight} ${g.size}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.globalAlpha = g.alpha;
  const e = g.e;
  ctx.shadowColor = e < 0.5 ? `rgba(90,220,255,${0.9 * (1 - e)})` : `rgba(0,22,96,${0.6 * e})`;
  ctx.shadowBlur = mix(g.size * 0.55, g.size * 0.09, e); ctx.shadowOffsetY = mix(0, g.size * 0.035, e);
  ctx.fillStyle = `rgb(${g.col[0] | 0},${g.col[1] | 0},${g.col[2] | 0})`;
  ctx.fillText(q.ch, 0, L.capK * g.size / 2);
  ctx.restore();
}
function drawOverlay(t, s) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!gl) drawFallback(t, s);
  const gs = L.glyphs.map((q, i) => glyphState(q, i, t, s));
  /* behind the globe first, then cut the globe's disc out of that layer */
  drawHud(t, s, true);
  L.glyphs.forEach((q, i) => { if (gs[i].back) drawGlyph(q, gs[i]); });
  if (gl) { ctx.save(); ctx.globalCompositeOperation = "destination-out"; ctx.beginPath(); ctx.arc(s.cx, s.cy, s.R * 0.99, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  drawHud(t, s, false);
  L.glyphs.forEach((q, i) => { if (!gs[i].back) drawGlyph(q, gs[i]); });

  /* lens light at the moment the hologram becomes real */
  if (s.flash > 0.004) {
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.translate(s.cx, s.cy);
    const streak = (rx, sy, al) => { ctx.save(); ctx.scale(1, sy);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx); g.addColorStop(0, `rgba(235,248,255,${al})`); g.addColorStop(0.25, `rgba(150,215,255,${al * 0.5})`); g.addColorStop(1, "rgba(120,200,255,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill(); ctx.restore(); };
    streak(W * 0.95, 0.010, s.flash); streak(s.R * 3.2, 0.05, s.flash * 0.7); streak(s.R * 1.7, 1, s.flash * 0.35);
    ctx.restore();
  }
  /* a band of light crosses the finished wordmark */
  const sh = seg(t, 8.3, 9.5);
  if (sh > 0 && sh < 1) {
    const x = mix(L.x0 - L.F * 0.9, L.textR + L.F * 0.9, inOut(sh)), d = L.F * 0.42;
    const g = ctx.createLinearGradient(x - d, L.baseW, x + d, L.baseW - d * 0.7);
    g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.5, "rgba(255,255,255,0.95)"); g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    for (const q of L.glyphs) { ctx.font = `${q.weight} ${q.size}px ${FONT}`; ctx.fillText(q.ch, q.x, q.base); }
    ctx.restore();
  }
  /* a glint as OS locks in */
  const gp = seg(t, 8.0, 8.7);
  if (gp > 0 && gp < 1) {
    const S = L.glyphs[8], a = Math.sin(Math.PI * gp), len = L.F * 0.55 * a, gx = S.x + S.size * 0.3, gy = S.base - L.capK * S.size;
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.translate(gx, gy); ctx.rotate(gp * 0.8);
    for (let i = 0; i < 2; i++) {
      const g = ctx.createLinearGradient(-len, 0, len, 0);
      g.addColorStop(0, "rgba(255,220,170,0)"); g.addColorStop(0.5, `rgba(255,245,225,${a})`); g.addColorStop(1, "rgba(255,220,170,0)");
      ctx.fillStyle = g; ctx.fillRect(-len, -1, 2 * len, 2); ctx.rotate(Math.PI / 2);
    }
    ctx.restore();
  }
}

/* ------------------------------------------------------------------ the clock */
let clock = 0, last = 0, frozen = null, shown = false, raf = 0;
function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  if (frozen === null) clock += dt;
  const t = frozen === null ? clock : frozen, s = state(t);
  drawGL(t, s); drawOverlay(t, s);
  if (!shown && t >= END) { shown = true; btn.classList.add("show"); }
}
function play(from) {
  frozen = null; clock = from || 0; shown = false; btn.classList.remove("show"); btn.textContent = "Replay";
  last = performance.now();
}
btn.addEventListener("click", () => play(0));
window.addEventListener("resize", () => { layout(); });
window.__seek = (sec) => { frozen = sec; };          /* hold one moment (for stills) */
window.__play = play;

initGL();
layout();
const fontsReady = (document.fonts && document.fonts.load)
  ? Promise.race([Promise.all([document.fonts.load(`800 100px ${FONT}`, "WRLDOS"), document.fonts.load(`600 100px ${FONT}`, "THE")]), new Promise(r => setTimeout(r, 2500))]).catch(() => {})
  : Promise.resolve();
Promise.all([loadTexture(0, TEX_SRC), loadTexture(1, MASK_SRC), fontsReady]).then(() => {
  layout();
  if (reduce) { frozen = END + 2; shown = true; btn.textContent = "Play animation"; btn.classList.add("show"); }
  else play(0);
  last = performance.now(); raf = requestAnimationFrame(frame);
});
})();
</script>
