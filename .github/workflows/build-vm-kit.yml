# Builds the portable build VM that "Build to ISO.bat" uses on Windows without WSL or Docker, and
# publishes it as the "build-vm-kit" release:
#   - wrld-build-vm.qcow2 (in parts if it is over GitHub's 2 GB file limit) and vmlinuz: Ubuntu
#     24.04 with every build tool, Rust and the 64-bit edition's WebKit packages
#   - wrld-build-vm-qemu-win64.zip: QEMU for Windows (from MSYS2), unpacked without installing
#   - kit.txt: the kit's version and each file's SHA-256
# Each part is tested first: the image builds the real ISOs under KVM on Linux, and the Windows
# QEMU runs build-iso.ps1 against the image.
name: Build VM kit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'          # monthly, for Ubuntu's updates
  push:
    paths:
      - 'tools/buildvm/**'
      - 'tools/build-iso.sh'
      - '.github/workflows/build-vm-kit.yml'

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Make room (the runner's unused SDKs)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq debootstrap qemu-utils qemu-system-x86
      - name: Make the image
        run: sudo tools/buildvm/make-image.sh "$PWD/kit"
      - name: Build the ISOs inside it (the kit's own test)
        run: |
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" kit
          cp kit/wrld-build-vm.qcow2 kit/test-base.qcow2
          mkdir test && cp kit/vmlinuz test/ && mv kit/test-base.qcow2 test/wrld-build-vm.qcow2
          tools/buildvm/run-vm.sh test .
          ls -la wrldos.iso wrldos64.iso
          rm -rf test
      - name: Split for GitHub's 2 GB file limit
        run: |
          cd kit
          if [ "$(stat -c %s wrld-build-vm.qcow2)" -gt 2000000000 ]; then
            split -b 1900M -d -a 2 wrld-build-vm.qcow2 wrld-build-vm.qcow2.part && rm wrld-build-vm.qcow2
          fi
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: vm-image
          path: |
            kit/vmlinuz
            kit/wrld-build-vm.qcow2*
          retention-days: 7
          compression-level: 0

  qemu:
    needs: image
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-qemu zip
      - name: Package QEMU
        shell: msys2 {0}
        run: |
          mkdir -p qemu/share
          cp /ucrt64/bin/qemu-system-x86_64.exe /ucrt64/bin/qemu-img.exe qemu/
          for f in bios-256k.bin bios.bin linuxboot_dma.bin linuxboot.bin kvmvapic.bin multiboot_dma.bin vgabios-stdvga.bin; do
            [ -f /ucrt64/share/qemu/$f ] && cp /ucrt64/share/qemu/$f qemu/share/
          done
          # accelerators and devices built as modules, where this build has them
          if [ -d /ucrt64/lib/qemu ]; then mkdir -p qemu/lib && cp -r /ucrt64/lib/qemu qemu/lib/; fi
          # every DLL the programs and the modules load, until nothing new turns up: a DLL left out
          # makes Windows show a dialog nobody can answer, and QEMU then hangs without a word
          for pass in 1 2 3 4; do
            find qemu -name '*.exe' -o -name '*.dll' | while read -r f; do ldd "$f" 2>/dev/null || true; done \
              | awk '$3 ~ /^\/ucrt64\// { print $3 }' | sort -u | while read -r d; do [ -f "qemu/$(basename "$d")" ] || cp "$d" qemu/; done || true
          done
          echo "DLLs in the kit ($(ls qemu/*.dll | wc -l)):"; ls qemu/*.dll | xargs -n1 basename | sort | tr '\n' ' '; echo
          # what the packaged copy still cannot find with MSYS2's folder off the PATH (ldd prints ??? or "not found")
          echo "Unresolved with only Windows' folders on the PATH:"
          (cd qemu && PATH=/usr/bin:/c/Windows/System32:/c/Windows ldd ./qemu-system-x86_64.exe 2>&1 | grep -E '\?\?\?|not found|/ucrt64/' || echo "  none")
          # the packaged copy on its own, as it runs on a computer without MSYS2
          (cd qemu && PATH=/c/Windows/System32:/c/Windows /usr/bin/timeout 60 ./qemu-system-x86_64.exe --version) || { echo "QEMU does not start without MSYS2's folder: it did not start or did not finish in a minute"; exit 1; }
          (cd qemu && PATH=/c/Windows/System32:/c/Windows /usr/bin/timeout 60 ./qemu-system-x86_64.exe -machine help > /dev/null) || { echo "QEMU's machine list failed without MSYS2's folder"; exit 1; }
          (cd qemu && zip -qr ../wrld-build-vm-qemu-win64.zip .)
          ls -la wrld-build-vm-qemu-win64.zip
      - uses: actions/download-artifact@v4
        with:
          name: vm-image
          path: testkit
      - name: Test build-iso.ps1 with this QEMU and the new image
        shell: pwsh
        run: |
          $kit = "$env:RUNNER_TEMP\kit"
          New-Item -ItemType Directory -Force $kit | Out-Null
          Copy-Item testkit\vmlinuz $kit
          $parts = Get-ChildItem testkit -Filter 'wrld-build-vm.qcow2*' | Sort-Object Name
          $out = [IO.File]::Create("$kit\wrld-build-vm.qcow2"); foreach ($p in $parts) { $in = [IO.File]::OpenRead($p.FullName); $in.CopyTo($out); $in.Close() }; $out.Close()
          tar -xf wrld-build-vm-qemu-win64.zip -C (New-Item -ItemType Directory -Force "$kit\qemu")
          "version test" | Set-Content "$kit\kit.txt"
          # first, does this QEMU start at all, and boot the kernel? (no disks, the console to a file)
          $q = "$kit\qemu\qemu-system-x86_64.exe"
          $v = Start-Process -FilePath $q -ArgumentList '--version' -PassThru -NoNewWindow -RedirectStandardOutput "$kit\ver.txt" -RedirectStandardError "$kit\ver-err.txt"
          if (-not $v.WaitForExit(60000)) { Stop-Process -Id $v.Id -Force; throw "QEMU from the kit did not even print its version in a minute (a DLL missing?)" }
          Get-Content "$kit\ver.txt", "$kit\ver-err.txt"
          $smoke = Start-Process -FilePath $q -PassThru -NoNewWindow -RedirectStandardError "$kit\smoke-err.txt" -RedirectStandardOutput "$kit\smoke-out.txt" -ArgumentList @('-L', "`"$kit\qemu\share`"", '-machine', 'q35', '-m', '1024', '-accel', 'tcg', '-kernel', "`"$kit\vmlinuz`"", '-append', '"console=ttyS0 panic=-1"', '-serial', "`"file:$kit\smoke.log`"", '-display', 'none', '-monitor', 'none', '-no-reboot')
          Start-Sleep -Seconds 120
          if (-not $smoke.HasExited) { Stop-Process -Id $smoke.Id -Force }
          Write-Host "---- kernel console in two minutes (first 60 lines) ----"
          if (Test-Path "$kit\smoke.log") { Get-Content "$kit\smoke.log" -TotalCount 60 } else { Write-Host "(no console file)" }
          Write-Host "---- QEMU's own messages ----"
          Get-Content "$kit\smoke-err.txt", "$kit\smoke-out.txt" -ErrorAction SilentlyContinue
          # a stand-in for the build: the VM boots, reads the sources, checks its tools, writes two files back
          $src = "$env:RUNNER_TEMP\src"
          New-Item -ItemType Directory -Force "$src\tools" | Out-Null
          [IO.File]::WriteAllText("$src\tools\build-iso.sh", "#!/bin/bash`nset -e`nuname -a`ncommand -v gcc nasm grub-mkrescue xorriso cargo`npkg-config --modversion webkitgtk-6.0`necho fake > /root/src/wrldos.iso`necho fake > /root/src/wrldos64.iso`n")
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\buildvm\build-iso.ps1 -Mode vm -Src $src -KitDir $kit -NoDownload -Emulate -BootLog -TimeoutMinutes 45
          if ($LASTEXITCODE -ne 0) { throw "build-iso.ps1 failed" }
          Get-Content "$src\build-vm.log"
          if ((Get-Content "$src\wrldos.iso") -ne 'fake') { throw "no result came back from the VM" }
      - uses: actions/upload-artifact@v4
        with:
          name: vm-qemu
          path: wrld-build-vm-qemu-win64.zip
          retention-days: 7

  publish:
    needs: [image, qemu]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: kit
          merge-multiple: true
      - name: Publish the "build-vm-kit" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd kit
          { echo "version $(date -u +%Y-%m-%dT%H:%MZ)-${GITHUB_SHA::8}"; sha256sum vmlinuz wrld-build-vm.qcow2* wrld-build-vm-qemu-win64.zip | sed 's/ \*/ /; s/  / /'; } > kit.txt
          cat kit.txt
          gh release delete build-vm-kit --yes --cleanup-tag 2>/dev/null || true
          gh release create build-vm-kit --target "$GITHUB_SHA" --title "Build VM kit" \
            --notes "The portable Linux build VM that Build to ISO.bat downloads when a PC has neither WSL nor Docker. Built from $GITHUB_SHA." \
            kit.txt vmlinuz wrld-build-vm.qcow2* wrld-build-vm-qemu-win64.zip
